apiVersion: v1
kind: Namespace
metadata:
  name: aceest
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aceest-data
  namespace: aceest
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  selector:
    app: aceest-fitness
    slot: blue
  ports:
    - port: 5000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue
  namespace: aceest
spec:
  selector: {app: aceest-fitness, slot: blue}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-green
  namespace: aceest
spec:
  selector: {app: aceest-fitness, slot: green}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-candidate
  namespace: aceest
spec:
  selector: {app: aceest-fitness, slot: candidate}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
  namespace: aceest
spec:
  selector: {app: aceest-fitness, slot: rolling}
  ports: [{port: 5000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-router
  namespace: aceest
spec:
  type: NodePort
  selector: {app: aceest-router}
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aceest-router
  namespace: aceest
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: aceest-router}
