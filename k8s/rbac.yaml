apiVersion: v1
kind: ServiceAccount
metadata:
  name: aceest-deployer
  namespace: aceest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aceest-deployer
  namespace: aceest
rules:
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, create, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [services/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aceest-deployer
  namespace: aceest
subjects:
  - kind: ServiceAccount
    name: aceest-deployer
    namespace: aceest
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aceest-deployer
